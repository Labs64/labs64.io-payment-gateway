services:
  postgres:
    image: postgres:18-alpine
    env_file: ./.env
    hostname: postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ${HOST_PROJECT_DIR:-.}/docker/initdb
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:8-alpine
    hostname: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    env_file: ./.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Central authorization PDP. Serves the module's own generated
  # policy set from target/cerbos (produced by `mvn package`). HTTP :3592,
  # gRPC :3593 (the Java SDK talks gRPC).
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.51.0
    command:
      - server
      - --set=storage.disk.directory=/policies
      - --set=storage.disk.watchForChanges=true
    hostname: cerbos
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${HOST_PROJECT_DIR:-.}/target/cerbos/policies
        target: /policies
        read_only: true
    ports:
      - "3592:3592"
      - "3593:3593"
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=grpc"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
