server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: labs64.io-payment-gateway

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paymentgateway}
    username: ${DB_USERNAME:paymentgateway}
    password: ${DB_PASSWORD:paymentgateway}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  # Distributed tracing is infrastructure-owned (OTel Java Agent) — no in-app tracer/sampler.
  # Metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish an le=0.5s histogram bucket so the latency SLO rule
      # (slo:latency:ratio_rate5m) has a bucket to divide on.
      slo:
        http.server.requests: 500ms
  prometheus:
    metrics:
      export:
        enabled: true

# Payment Gateway Configuration
payment-gateway:
  public-base-url: ${PAYMENT_GATEWAY_PUBLIC_BASE_URL:http://localhost:8080}
  payment-definitions:
    - provider: "stripe"
      enabled: true
      name: "Stripe"
      description: "Credit/Debit Card via Stripe"
      recurring: true
      supported-currencies: ["USD", "EUR", "GBP"]
      supported-countries: ["US", "GB", "DE"]
    - provider: "paypal"
      enabled: true
      name: "PayPal"
      description: "PayPal Checkout"
      recurring: false
      supported-currencies: ["USD", "EUR"]
      supported-countries: ["US", "DE"]
    - provider: "noop"
      enabled: true
      name: "No-Op (Test)"
      description: "Test payment provider - always succeeds"
      recurring: false
      supported-currencies: ["USD", "EUR"]
      supported-countries: ["US", "DE"]
  retry:
    max-retries: 3
    retry-interval-seconds: 60
    backoff-multiplier: 2.0
  redis:
    distributed-lock-ttl-seconds: 30
  idempotency:
    redis-ttl: ${IDEMPOTENCY_REDIS_TTL:PT3H}
    database-ttl: ${IDEMPOTENCY_DATABASE_TTL:P1D}
    processing-timeout: ${IDEMPOTENCY_PROCESSING_TIMEOUT:PT5M}
    cleanup-interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1H}
    cleanup-batch-size: ${IDEMPOTENCY_CLEANUP_BATCH_SIZE:1000}

# Trusted gateway auth-context (auth-context-spring-boot-starter).
# Fail-closed: non-public paths 401 without valid X-Auth-* headers from the
# gateway. public-paths here are ONLY non-OpenAPI framework surfaces. Public API
# operations (PSP webhooks, browser redirect returns, payment-definitions —
# no JWT possible; webhook authenticity is PSP-signature-checked in WebhookService)
# come from the build-generated auth-public-paths resource, derived from the
# x-labs64.auth metadata — OpenAPI is the single source of truth.
# tenant.default is a dev-only fallback for gateway-less runs.
labs64:
  openapi:
    spec-location: classpath:openapi/openapi-payment-gateway-v1.yaml
    gateway-path: /payment-gateway/api/v1
    local-path: /
  auditflow:
    enabled: ${AUDITFLOW_ENABLED:false}
    url: ${AUDITFLOW_URL:}
    source-system: ${AUDITFLOW_SOURCE_SYSTEM:${spring.application.name}}
    connect-timeout: ${AUDITFLOW_CONNECT_TIMEOUT:5s}
    request-timeout: ${AUDITFLOW_REQUEST_TIMEOUT:10s}
    retry-max-attempts: ${AUDITFLOW_RETRY_MAX_ATTEMPTS:3}
    oauth2:
      registration-id: auditflow
      token-uri: ${AUDITFLOW_OAUTH_TOKEN_URI:}
      client-id: ${AUDITFLOW_OAUTH_CLIENT_ID:}
      client-secret: ${AUDITFLOW_OAUTH_CLIENT_SECRET:}
      scopes: ${AUDITFLOW_OAUTH_SCOPES:audit-event:write}
  auth-context:
    enabled: ${LABS64_AUTHCONTEXT_ENABLED:true}
    public-paths:
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /error
  tenant:
    default: ${LABS64_TENANT_DEFAULT:}
  auth:
    # Domain authorization via the central Cerbos PDP. SHADOW evaluates + audits
    # every decision without blocking; flip to ENFORCE only after the shadow
    # diff is clean (deploy-time override via LABS64_AUTH_AUTHZ_MODE).
    authz:
      enabled: ${LABS64_AUTH_AUTHZ_ENABLED:true}
      mode: ${LABS64_AUTH_AUTHZ_MODE:ENFORCE}
      # Cerbos PDP gRPC address (host:port). In-cluster:
      # cerbos.<ns>.svc.cluster.local:3593.
      pdp-address: ${LABS64_AUTH_AUTHZ_PDPADDRESS:localhost:3593}

# Logging Configuration
logging:
  level:
    root: INFO
    io.labs64: DEBUG
    org.springframework.security.oauth2.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-}] [%X{tenantId:-}] - %msg%n"
