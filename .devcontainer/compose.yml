services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      SPRING_PROFILES_ACTIVE: local
      CLAUDE_CONFIG_DIR: /home/l64user/.claude
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: paymentgateway
      DB_USERNAME: paymentgateway
      DB_PASSWORD: paymentgateway
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LABS64_AUTH_AUTHZ_PDPADDRESS: cerbos:3593
    volumes:
      - ..:/workspaces/labs64.io-payment-gateway
      - maven-repository:/home/l64user/.m2/repository
      - vscode-extensions:/home/l64user/.vscode-server/extensions
      - vscode-server-data:/home/l64user/.vscode-server/data
      - codex-data:/home/l64user/.codex
      - claude-data:/home/l64user/.claude
      - copilot-data:/home/l64user/.copilot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cerbos:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: paymentgateway
      POSTGRES_USER: paymentgateway
      POSTGRES_PASSWORD: paymentgateway
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../payment-gateway-be/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentgateway -d paymentgateway"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.51.0
    command:
      - server
      - --set=storage.disk.directory=/workspace/target/cerbos/policies
      - --set=storage.disk.watchForChanges=true
    restart: unless-stopped
    volumes:
      - ../payment-gateway-be:/workspace:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=grpc"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  maven-repository:
    name: labs64io-maven-repository
  vscode-extensions:
    name: labs64io-vscode-extensions
  vscode-server-data:
  codex-data:
  claude-data:
  copilot-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
