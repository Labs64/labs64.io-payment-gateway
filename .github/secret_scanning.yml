# Secret scanning: paths GitHub does not scan.
#
# The WireMock stub mappings match the HTTP Basic header the e2e suite sends to the PSP stub, e.g.
# `paypal-client-id:paypal-client-secret`. These are fixture values chosen by the tests (the
# `paypal-error-*` and `paypal-incomplete-*` variants select the error and incomplete token
# responses); no real PayPal or Stripe credential belongs in this directory.
paths-ignore:
  - "tests/psp-stub/wiremock/mappings/**"
