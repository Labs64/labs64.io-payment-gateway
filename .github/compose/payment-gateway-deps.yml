services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: paymentgateway
      POSTGRES_USER: paymentgateway
      POSTGRES_PASSWORD: paymentgateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentgateway -d paymentgateway"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: valkey/valkey:9.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
