name: Labs64.IO - Payment Gateway Backend - Publish Docker

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  build-and-push:
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/payment-gateway
      context: ./payment-gateway-be
      mode: release
      version: ${{ github.event.release.tag_name }}
      build-command: mvn -B -pl payment-gateway-be -am package
      java-version: "25"
    secrets: inherit
