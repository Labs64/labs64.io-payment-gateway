name: Labs64.IO - Payment Gateway Backend - CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "payment-gateway-be/**"
      - "payment-gateway-providers/**"
      - "pom.xml"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  pull_request:
    paths:
      - "payment-gateway-be/**"
      - "payment-gateway-providers/**"
      - "pom.xml"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  workflow_dispatch:

concurrency:
  group: payment-gateway-be-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test:
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      # Root reactor pom (payment-gateway-providers + payment-gateway-be); -pl/-am
      # need the reactor root, not the module's own pom.xml.
      working-directory: .
      maven-goals: -pl payment-gateway-be -am verify
      artifact-name: payment-gateway-be-test-reports
      compose-file: .github/compose/payment-gateway-deps.yml
      compose-project: payment-gateway
      # DB_HOST/PORT, DB_USERNAME/DB_PASSWORD, REDIS_*, RABBITMQ_* all match
      # the app's own application.yml defaults — the compose Postgres
      # container is seeded with paymentgateway/paymentgateway to match.
      docker-build-context: ./payment-gateway-be
      docker-build-tag: payment-gateway:ci-${{ github.sha }}
      submit-dependency-graph: true

  # Edge image — pushed to Docker Hub as :edge after a green master build, so
  # downstream integration environments can run today's master without building it.
  # labs64.io-tests' nightly regression deploys exactly this image; the release
  # path, which additionally pins the digest into the Helm chart, stays in
  # labs64io-docker-publish.yml.
  edge-image:
    name: Edge image (labs64/payment-gateway)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/payment-gateway
      context: ./payment-gateway-be
      mode: edge
      # The Dockerfile copies target/*.jar; -am so payment-gateway-providers is
      # built into the reactor first.
      build-command: mvn -B -ntp -DskipTests -pl payment-gateway-be -am package
      java-version: "25"
    secrets: inherit
