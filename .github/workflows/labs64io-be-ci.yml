name: Labs64.IO - Payment Gateway Backend - CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "payment-gateway-be/**"
      - "payment-gateway-providers/**"
      - "pom.xml"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  pull_request:
    paths:
      - "payment-gateway-be/**"
      - "payment-gateway-providers/**"
      - "pom.xml"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  workflow_dispatch:

concurrency:
  group: payment-gateway-be-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test:
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      # Root reactor pom (payment-gateway-providers + payment-gateway-be); -pl/-am
      # need the reactor root, not the module's own pom.xml.
      working-directory: .
      maven-goals: -pl payment-gateway-be -am verify
      artifact-name: payment-gateway-be-test-reports
      compose-file: .github/compose/payment-gateway-deps.yml
      compose-project: payment-gateway
      # DB_HOST/PORT, DB_USERNAME/DB_PASSWORD, REDIS_*, RABBITMQ_* all match
      # the app's own application.yml defaults — the compose Postgres
      # container is seeded with paymentgateway/paymentgateway to match.
      docker-build-context: ./payment-gateway-be
      docker-build-tag: payment-gateway:ci-${{ github.sha }}
      submit-dependency-graph: true
