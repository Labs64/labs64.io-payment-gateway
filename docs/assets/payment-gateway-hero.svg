<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" width="1200" height="640" role="img" aria-labelledby="t d">
<title id="t">Labs64.IO Payment Gateway</title>
<desc id="d">A shop retries POST /payments three times with the same Idempotency-Key; Payment Gateway replays the same answer and prints exactly one receipt: $30.00, routed to Stripe, confirmed, charged once.</desc>
<defs>
<radialGradient id="hg1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E14817" stop-opacity=".45"/><stop offset="1" stop-color="#E14817" stop-opacity="0"/></radialGradient>
<radialGradient id="hg2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F2951C" stop-opacity=".22"/><stop offset="1" stop-color="#F2951C" stop-opacity="0"/></radialGradient>
<pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F8EDE5" stroke-opacity=".06"/></pattern>
<filter id="hglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="hwin"><rect width="1200" height="640" rx="18"/></clipPath>
<clipPath id="hslot"><rect x="700" y="264" width="420" height="320"/></clipPath><style>
    .sans{font-family:Roboto,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    text{white-space:pre}
    @media (prefers-reduced-motion: reduce){ animate, animateMotion, animateTransform{display:none} }
  </style>
</defs>
<g clip-path="url(#hwin)">
<rect width="1200" height="640" fill="#170A05"/><rect width="1200" height="640" fill="url(#hgrid)"/>
<ellipse cx="180" cy="40" rx="420" ry="300" fill="url(#hg1)"/><ellipse cx="1040" cy="560" rx="360" ry="260" fill="url(#hg2)"/>
<rect width="1200" height="44" fill="#22100A"/><line x1="0" y1="44" x2="1200" y2="44" stroke="#F8EDE5" stroke-opacity=".1"/>
<circle cx="28" cy="22" r="6" fill="#E14817"/><circle cx="50" cy="22" r="6" fill="#F2951C"/><circle cx="72" cy="22" r="6" fill="#87888A"/>
<text x="600" y="27" class="mono" font-size="13" fill="#87888A" text-anchor="middle" letter-spacing="0.5">labs64.io-payment-gateway · POST /payments</text>
<text x="64" y="100" class="sans" font-size="13" font-weight="500" fill="#F08B53" letter-spacing="3.6">LABS64.IO  ·  PAYMENT GATEWAY</text>
<text x="64" y="156" class="sans" font-size="48" font-weight="700" fill="#F8EDE5" letter-spacing="-1.4">One API. Every payment provider.</text>
<text x="64" y="212" class="sans" font-size="48" font-weight="700" fill="#E14817" letter-spacing="-1.4">Charged once, never twice.</text>
<text x="1136" y="212" class="mono" font-size="14" fill="#F8EDE5" fill-opacity="0.6" text-anchor="end">idempotent  ·  multi-tenant  ·  PSP-agnostic</text>
<rect x="64" y="256" width="560" height="296" rx="12" fill="#22100A" stroke="#F8EDE5" stroke-opacity=".12"/><text x="88" y="288" class="mono" font-size="13" fill="#87888A"># the network is flaky, so your shop retries</text><g opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;0.017;0.033;.95;1" dur="6s" begin="0s" repeatCount="indefinite"/><text x="88" y="326" class="mono" font-size="15" font-weight="500" fill="#F8EDE5">POST /payments</text><text x="88" y="350" class="mono" font-size="13" fill="#F08B53">Idempotency-Key: 7f3a-91c2</text><rect x="300" y="311" width="88" height="22" rx="11" fill="none" stroke="#F8EDE5" stroke-opacity=".3"/><text x="308" y="327" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.8">attempt 1</text><text x="600" y="350" class="mono" font-size="13" fill="#F8EDE5" text-anchor="end">201 Created</text></g><g opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;0.250;0.267;.95;1" dur="6s" begin="0s" repeatCount="indefinite"/><text x="88" y="394" class="mono" font-size="15" font-weight="500" fill="#F8EDE5">POST /payments</text><text x="88" y="418" class="mono" font-size="13" fill="#F08B53">Idempotency-Key: 7f3a-91c2</text><rect x="300" y="379" width="72" height="22" rx="11" fill="none" stroke="#F8EDE5" stroke-opacity=".3"/><text x="308" y="395" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.8">retry 2</text><text x="600" y="418" class="mono" font-size="13" fill="#E14817" text-anchor="end">↩ 200 · replayed</text></g><g opacity=".35"><animate attributeName="opacity" values=".35;.35;1;1;.35" keyTimes="0;0.483;0.500;.95;1" dur="6s" begin="0s" repeatCount="indefinite"/><text x="88" y="462" class="mono" font-size="15" font-weight="500" fill="#F8EDE5">POST /payments</text><text x="88" y="486" class="mono" font-size="13" fill="#F08B53">Idempotency-Key: 7f3a-91c2</text><rect x="300" y="447" width="72" height="22" rx="11" fill="none" stroke="#F8EDE5" stroke-opacity=".3"/><text x="308" y="463" class="mono" font-size="12" fill="#F8EDE5" fill-opacity="0.8">retry 3</text><text x="600" y="486" class="mono" font-size="13" fill="#E14817" text-anchor="end">↩ 200 · replayed</text></g><text x="88" y="536" class="mono" font-size="12" fill="#87888A">same key → same payment → same answer</text><rect x="700" y="252" width="400" height="22" rx="11" fill="#2b150c" stroke="#F8EDE5" stroke-opacity=".25"/><g clip-path="url(#hslot)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,-300;0,0" keyTimes="0;.88;.92;1" dur="6s" repeatCount="indefinite"/><polygon points="730,264 1070,264 1070,548 1061.5,560 1053,548 1044.5,560 1036,548 1027.5,560 1019,548 1010.5,560 1002,548 993.5,560 985,548 976.5,560 968,548 959.5,560 951,548 942.5,560 934,548 925.5,560 917,548 908.5,560 900,548 891.5,560 883,548 874.5,560 866,548 857.5,560 849,548 840.5,560 832,548 823.5,560 815,548 806.5,560 798,548 789.5,560 781,548 772.5,560 764,548 755.5,560 747,548 738.5,560 730,548 730,548" fill="#F8EDE5"/><text x="900" y="296" class="mono" font-size="12" fill="#6b5a50" text-anchor="middle" letter-spacing="2">LABS64.IO · PAYMENT</text><text x="900" y="346" class="sans" font-size="44" font-weight="700" fill="#170A05" text-anchor="middle" letter-spacing="-1">$30.00</text><text x="900" y="372" class="mono" font-size="13" fill="#6b5a50" text-anchor="middle">order #1001 · Pro plan</text><path d="M752,392 H1048" stroke="#170A05" stroke-opacity=".3" stroke-dasharray="4 5"/><text x="756" y="420" class="mono" font-size="14" fill="#6b5a50">payment</text><text x="1044" y="420" class="mono" font-size="14" font-weight="500" fill="#170A05" text-anchor="end">pay_8Q2c41</text><text x="756" y="448" class="mono" font-size="14" fill="#6b5a50">provider</text><text x="1044" y="448" class="mono" font-size="14" font-weight="500" fill="#170A05" text-anchor="end">Stripe</text><text x="756" y="476" class="mono" font-size="14" fill="#6b5a50">status</text><text x="1044" y="476" class="mono" font-size="14" font-weight="500" fill="#1F9D55" text-anchor="end">CONFIRMED</text><text x="756" y="504" class="mono" font-size="14" fill="#6b5a50">charged</text><text x="1044" y="504" class="mono" font-size="14" font-weight="500" fill="#170A05" text-anchor="end">1 ×</text><g opacity="0" transform="rotate(-9 960 500)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.53;.94;1" dur="6s" begin="0s" repeatCount="indefinite"/><rect x="880" y="474" width="160" height="40" rx="6" fill="none" stroke="#E14817" stroke-width="3"/><text x="960" y="500" class="mono" font-size="15" font-weight="500" fill="#E14817" text-anchor="middle" letter-spacing="2">NEVER TWICE</text></g></g></g>
<text x="64" y="598" class="mono" font-size="13" fill="#87888A">Apache-2.0 · Spring Boot · PostgreSQL · Valkey</text>
<text x="1136" y="598" class="mono" font-size="13" fill="#F08B53" text-anchor="end">labs64.io/docs</text>
<rect x="0" y="636" width="1200" height="4" fill="#E14817" opacity=".9"><animate attributeName="width" dur="6s" repeatCount="indefinite" values="0;1200"/></rect>
</g><rect x=".5" y=".5" width="1199" height="639" rx="18" fill="none" stroke="#F8EDE5" stroke-opacity=".12"/></svg>
